<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Dakota's Grocery Planner</title>
<style>
:root{
  --bg:#f6f3ee;--card:#fff;--ink:#1d2320;--mute:#66716b;--line:#e4dfd6;
  --brand:#1f6f4a;--brand-ink:#fff;--soft:#e6f1ea;--warn:#b86e00;--warnbg:#fff3dc;--bad:#b3261e;--badbg:#fde8e6;--ice:#e3eefb;--ice-ink:#1c4f8a;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141815;--card:#1d231f;--ink:#eef2ee;--mute:#9aa7a0;--line:#2c352f;--brand:#4fb582;--brand-ink:#08140d;--soft:#1f3a2c;--warn:#f0b04a;--warnbg:#3a2c10;--bad:#ff8a80;--badbg:#3d1a17;--ice:#1b2e47;--ice-ink:#9cc4f5}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:12px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
header.top .in{max-width:640px;margin:0 auto}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.mute{color:var(--mute);font-size:13px}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.meter>i{display:block;height:100%;background:var(--brand);transition:width .25s}
.meter.warn>i{background:var(--warn)}.meter.bad>i{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0}
.card.flag{border-color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:5px 11px;background:var(--card);font-size:14px;min-height:34px}
.chip.on{background:var(--soft);border-color:var(--brand);font-weight:600}
.chip.ice{background:var(--ice);color:var(--ice-ink);border-color:transparent}
.chip.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--brand);color:var(--brand-ink);font-weight:600;min-height:44px}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}
.btn.full{width:100%}
.meal{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.meal .nm{font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;border:0;background:none;padding:12px 4px 10px;font-size:14px;color:var(--mute);font-weight:600}
nav.tabs button.on{color:var(--brand)}
nav.tabs button b{display:block;font-size:20px;line-height:1}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item input[type=checkbox]{width:24px;height:24px;accent-color:var(--brand);flex:none}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.item .t{flex:1;min-width:0}
.item .p{font-variant-numeric:tabular-nums;white-space:nowrap;border:0;background:none;padding:6px 4px;color:var(--ink)}
.qty{display:inline-flex;align-items:center;gap:2px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-width:640px;margin:0 auto;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px}
.note{border-radius:10px;padding:9px 11px;background:var(--soft);font-size:14px;margin:8px 0}
.note.warn{background:var(--warnbg)}.note.bad{background:var(--badbg)}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px}
input[type=text]{width:100%}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.bars{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:6px}
.bars div{flex:1;background:var(--brand);border-radius:5px 5px 0 0;min-height:3px;position:relative}
.bars div span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;color:var(--mute)}
.est{color:var(--mute)}
.hero{position:relative;height:150px;border-radius:var(--r);overflow:hidden;margin:10px 0;background:#1d3a2c}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero b{position:absolute;left:14px;bottom:12px;right:14px;color:#fff;font-size:20px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0) 60%)}
.hero b{z-index:1}
.art{position:relative;overflow:hidden;border-radius:12px;height:116px;display:flex;align-items:center;justify-content:center}
.art .plate{position:absolute;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 3px 10px rgba(0,0,0,.25),inset 0 0 0 6px rgba(0,0,0,.05)}
.art .e0{position:relative;font-size:54px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.art .e1,.art .e2{position:absolute;font-size:26px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.art .e1{left:calc(50% + 40px);top:62px}.art .e2{left:calc(50% - 68px);top:18px}
.art.sm{height:64px;width:64px;flex:none;border-radius:10px}
.art.sm .plate{width:48px;height:48px}.art.sm .e0{font-size:28px}.art.sm .e1,.art.sm .e2{display:none}
.art .time{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.45);color:#fff;border-radius:99px;font-size:12px;padding:2px 8px}
.art.sm .time{display:none}
.art .heart{position:absolute;left:8px;top:6px;color:#ff5a6e;font-size:22px;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.art.sm .heart{font-size:14px;left:4px;top:2px}
.chip.love.on{background:#ffe3e7;border-color:#e0425a;color:#b3213a}
@media (prefers-color-scheme:dark){.chip.love.on{background:#4a1c25;color:#ff9aa8}}
.mc{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:0}
.card.sel{border-color:var(--brand);background:var(--soft)}
.ring{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:2px;background:var(--card)}
.card.sel .ring{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.cost{font-variant-numeric:tabular-nums;font-weight:600}
.tag{font-size:12px;border-radius:6px;padding:1px 6px;background:var(--line);color:var(--mute)}
</style>
</head>

  if(ids.some(i=>RAWMEAT.includes(i)))return "early";

}

function suggest(n){
  const have=planned(),cnt={};
  have.forEach(id=>{const m=meal(id);if(m)cnt[m.t]=(cnt[m.t]||0)+1;});
  const sc=MEALS.filter(m=>!have.includes(m.id)&&!isNo(m.id)&&(cnt[m.t]||0)<2).map(m=>({m,s:(TW[m.t]||1)+(m.hf?0:2)+(m.fav?.5:0)+(loved(m.id)?2.5:0)+Math.random()*1.5}));
  sc.sort((a,b)=>b.s-a.s);
  const out=[],seen=new Set();
  for(const x of sc){if(out.length>=n)break;if(seen.has(x.m.t))continue;seen.add(x.m.t);out.push(x.m);}
  return out;
}

/* ========= LIST ENGINE ========= */
function compute(){
  const main={},mid={};
  for(let off=0;off<7;off++){
    for(const sl of S.plan[off]){
      const m=meal(sl.id);if(!m)continue;
      for(const [raw,f] of m.items){
        const id=rid(raw);
        const target=(sl.mode==="midweek"&&ITEMS[id].f)?mid:main;
        target[id]=(target[id]||0)+f;
      }
    }
  }
  const pk=o=>{const r={};for(const id in o){r[id]=Math.max(1,Math.ceil(o[id]-1e-9));}return r;};
  const M=pk(main),R=pk(mid);
  // split pantry items from buy items
  const buy={},pan={};
  for(const id in M){if(ITEMS[id].pan){pan[id]=M[id];}else buy[id]=M[id];}
  const extras={};
  for(const id in S.extras){if(S.extras[id]>0)extras[id]=S.extras[id];}
  for(const id in S.need){if(S.need[id]&&pan[id])buy[id]=(buy[id]||0)+1;}
  const lines=[];
  const add=(id,q,src)=>{if(S.have[id]&&src!=="x")return;lines.push({id,q,src,cost:q*price(id)});};
  for(const id in buy)add(id,buy[id],"m");
  for(const id in extras){
    // an item needed by a meal and also added as a basic: sum quantities into one line
    const ex=lines.find(l=>l.id===id&&l.src==="m");
    if(ex){ex.q+=extras[id];ex.cost=ex.q*price(id);}else add(id,extras[id],"x");
  }
  for(const c of S.custom){lines.push({id:"c:"+c.id,q:c.q,src:"c",custom:c,cost:c.q*c.p});}
  const run2=[];
  for(const id in R){if(!S.have[id])run2.push({id,q:R[id],src:"r",cost:R[id]*price(id)});}
  const panList=Object.keys(pan).filter(id=>!S.need[id]);
  const panNeed=Object.keys(pan).filter(id=>S.need[id]);
  const tot=a=>a.reduce((s,l)=>s+l.cost,0);
  const homeCost=[...lines,...run2].filter(l=>l.src!=="c"&&ITEMS[l.id].s==="home").reduce((s,l)=>s+l.cost,0);
  const tax=homeCost*(S.taxRate/100);
  const all=tot(lines)+tot(run2);
  return {lines,run2,panList,panNeed,main:tot(lines),mid:tot(run2),home:homeCost,tax,food:all-homeCost,total:all+tax};
}
function mealCost(m){return m.items.reduce((s,[raw,f])=>s+f*price(rid(raw)),0);}
function freezeCount(){let n=0;for(let o=0;o<7;o++)for(const sl of S.plan[o])if(sl.mode==="freeze"&&hasFresh(sl.id))n++;return n;}
function hasFresh(mid){const m=meal(mid);return m&&m.items.some(([r])=>ITEMS[rid(r)].f);}
function weekSpent(){const cut=Date.now()-7*864e5;return S.log.filter(e=>new Date(e.d).getTime()>=cut).reduce((s,e)=>s+e.amt,0);}

/* ========= MENU ========= */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const QUOTA={Beef:3,Pork:3,Chicken:2,Turkey:1,Seafood:1,"Snack plate":1};
function wpick(pool,r){
  const w=pool.map(m=>(m.hf?1:m.fav?2:3)*(S.rate[m.id]==="love"?4:1));const tot=w.reduce((a,b)=>a+b,0);let x=r()*tot;
  for(let i=0;i<pool.length;i++){x-=w[i];if(x<=0)return pool[i];}return pool[pool.length-1];
}
function genMenu(seed,keep,exclude){
  const r=rng(seed);const ids=keep.slice();
  const has=id=>ids.includes(id);
  const hfCount=()=>ids.filter(i=>meal(i)&&meal(i).hf).length;
  const take=(type,n)=>{
    let have=ids.filter(i=>meal(i)&&meal(i).t===type).length;
    while(have<n){
      let pool=MEALS.filter(m=>m.t===type&&!has(m.id)&&!isNo(m.id)&&(!exclude.includes(m.id)||loved(m.id))&&!(m.hf&&hfCount()>=2));
      if(!pool.length)pool=MEALS.filter(m=>m.t===type&&!has(m.id)&&!isNo(m.id));
      if(!pool.length)break;
      ids.push(wpick(pool,r).id);have++;
    }
  };
  for(const t in QUOTA)take(t,QUOTA[t]);
  const wild=MEALS.filter(m=>(m.t==="Beef"||m.t==="Pork")&&!has(m.id)&&!m.hf&&!isNo(m.id)&&!exclude.includes(m.id));
  if(wild.length&&ids.length<13)ids.push(wpick(wild,r).id);
  const CHEAP=["ramenglow","velvglow","pizzaup","spudbowl"];
  while(ids.filter(i=>CHEAP.includes(i)).length<2){const cp=MEALS.filter(m=>CHEAP.includes(m.id)&&!has(m.id)&&!isNo(m.id));if(!cp.length)break;ids.push(wpick(cp,r).id);}
  const pantryHave=()=>ids.filter(i=>meal(i)&&lane(meal(i))==="pantry").length;
  while(pantryHave()<3){const pp=MEALS.filter(m=>lane(m)==="pantry"&&!has(m.id)&&!isNo(m.id));if(!pp.length)break;ids.push(wpick(pp,r).id);}
  // always put up to 2 of his loved meals on the menu
  const lv=MEALS.filter(m=>loved(m.id)&&!has(m.id)).map(m=>[r(),m]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]).slice(0,Math.max(0,2-ids.filter(i=>loved(i)).length));
  lv.forEach(m=>ids.push(m.id));
  return ids;
}
function moreMenu(){
  const r=rng(S.menu.seed*7+S.menu.ids.length);const ids=menuIds();let add=0;
  while(add<6){const pool=MEALS.filter(m=>!ids.includes(m.id)&&!isNo(m.id)&&(!S.lastPicks.includes(m.id)||loved(m.id)));if(!pool.length)break;const m=wpick(pool,r);S.menu.ids.push(m.id);ids.push(m.id);add++;}
}
const menuIds=()=>{const a=S.menu.ids.filter(i=>!isNo(i));planned().forEach(i=>{if(!a.includes(i))a.push(i);});return a;};
function placeMeal(id,plan){
  const ln=lane(meal(id));
  const order=ln==="early"?[0,1,2,3,4,5,6]:ln==="mid"?[2,3,1,4,0,5,6]:[6,5,4,3,2,1,0];
  let best=order[0];
  for(const d of order){if(plan[d].length<plan[best].length)best=d;}
  plan[best].push({id,mode:defMode(best)});
}
function totalWith(plan){const old=S.plan;S.plan=plan;const t=compute().total;S.plan=old;return t;}
function clonePlan(){const o={};for(let i=0;i<7;i++)o[i]=S.plan[i].map(x=>Object.assign({},x));return o;}
function addCost(id){const a=clonePlan();const base=totalWith(a);placeMeal(id,a);return totalWith(a)-base;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickForMe(){
  const pool=menuIds().filter(id=>meal(id));
  let best=null,bs=-1e9;
  for(let t=0;t<250;t++){
    const sh=shuffle(pool);const pk=[];
    for(const id of sh){
      const m=meal(id);if(pk.length>=5)break;
            if(pk.filter(x=>meal(x).t===m.t).length>=2)continue;
      pk.push(id);
    }
    if(pk.length<5)continue;
    const plan={0:[],1:[],2:[],3:[],4:[],5:[],6:[]};pk.forEach(id=>placeMeal(id,plan));
    const tot=totalWith(plan);
    const nE=pk.filter(x=>lane(meal(x))==="early").length,nP=pk.filter(x=>lane(meal(x))==="pantry").length;
    const sc=(nP>=2?90:0)+(nE<=3?50:0)+(tot<=S.budget?100:-Math.min(90,(tot-S.budget)*5))+pk.filter(x=>!meal(x).hf).length*3+pk.filter(x=>loved(x)).length*4+pk.filter(x=>meal(x).t==="Beef"||meal(x).t==="Pork").length;
    if(sc>bs){bs=sc;best=plan;}
  }
  if(best)S.plan=best;
}

  S.extras=Object.assign({},CLONE().extras);S.need={};S.have={};S.checked={};S.tripDone=false;
  S.menu={seed:(S.menu.seed||1)+1,ids:[]};S.menu.ids=genMenu(S.menu.seed,[],S.lastPicks);

}

   <div class="chips" style="margin-top:10px">${[["All","All"],["Loved","♥ Loved"],["Beef","Beef"],["Pork","Pork"],["Chicken","Chicken"],["Turkey","Turkey"],["Seafood","Seafood"],["Snack plate","Snack plate"],["Hidden","Hidden"]].map(([t,l])=>`<button class="chip ${f===t?"on":""}" data-act="mfilter" data-v="${t}">${l}${t==="Loved"?" ("+MEALS.filter(m=>loved(m.id)).length+")":t==="Hidden"?" ("+MEALS.filter(m=>isNo(m.id)).length+")":""}</button>`).join("")}</div></div>`;

  if(b.classList.contains("sheet")&&e.target!==b)return;
  const a=b.dataset.act,d=b.dataset;
  if(a==="closesheet"){if(b.classList.contains("sheet")&&e.target.closest("[data-stop]")&&e.target!==b)return;UI.sheet=null;return render();}
  if(a==="tab"){S.tab=d.v;save();window.scrollTo(0,0);return render();}
  if(a==="beef"){S.beef=d.v;}
  else if(a==="sel"){const id=d.id;if(planned().includes(id)){for(let i=0;i<7;i++)S.plan[i]=S.plan[i].filter(x=>x.id!==id);}else placeMeal(id,S.plan);}
  else if(a==="love"){if(loved(d.id))delete S.rate[d.id];else S.rate[d.id]="love";}
  else if(a==="no"){S.rate[d.id]="no";for(let i=0;i<7;i++)S.plan[i]=S.plan[i].filter(x=>x.id!==d.id);S.menu.ids=S.menu.ids.filter(x=>x!==d.id);}
  else if(a==="restore"){delete S.rate[d.id];}
  else if(a==="pfm"){pickForMe();}
  else if(a==="mshuffle"){S.menu.seed=(S.menu.seed||1)+1;S.menu.ids=genMenu(S.menu.seed,planned(),S.lastPicks);}
  else if(a==="mmore"){moreMenu();}
  else if(a==="mfilter"){UI.mf=d.v;return render();}
  else if(a==="newweek"){newWeek();window.scrollTo(0,0);}
  else if(a==="clearplan"){for(let i=0;i<7;i++)S.plan[i]=[];}
  else if(a==="pick"){UI.sheet={d:+d.d};UI.sug=null;return render();}
  else if(a==="resug"){UI.sug=suggest(3);return render();}
  else if(a==="filter"){UI.filter=d.v;return render();}
  else if(a==="addmeal"){addMeal(UI.sheet.d,d.id);UI.sheet=null;UI.sug=null;}
  else if(a==="rm"){S.plan[+d.d].splice(+d.i,1);}
  else if(a==="mode"){S.plan[+d.d][+d.i].mode=d.v;}
  else if(a==="extra"){const id=d.id;if(b.type==="checkbox"){S.extras[id]=b.checked?1:0;}else S.extras[id]=(S.extras[id]||0)>0?0:1;}
  else if(a==="need"){S.need[d.id]=!S.need[d.id];}
  else if(a==="have"){S.have[d.id]=true;}
  else if(a==="unhave"){delete S.have[d.id];}
  else if(a==="chk"){S.checked[d.k]=b.checked;}
  else if(a==="editp"){
    if(d.c==="1"){const c=S.custom.find(x=>x.id===d.id);const v=prompt("Price for "+c.n,c.p);if(v!==null&&!isNaN(parseFloat(v)))c.p=parseFloat(v);}
    else{const v=prompt("Price for one: "+ITEMS[d.id].n,price(d.id));if(v!==null&&!isNaN(parseFloat(v)))S.prices[d.id]=parseFloat(v);}
  }
  else if(a==="addc"){const n=$("#cname").value.trim();const p=parseFloat($("#cprice").value)||0;if(!n)return;S.custom.push({id:String(Date.now()),n,p,q:1});}
  else if(a==="delc"){S.custom=S.custom.filter(c=>c.id!==d.id);}
  else if(a==="copy"){const t=listText(compute());(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("List copied.")).catch(()=>toast("Could not copy. Use Share instead."));return;}
  else if(a==="share"){const t=listText(compute());if(navigator.share){navigator.share({text:t}).catch(()=>{});}else if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast("List copied."));}return;}
  else if(a==="logtrip"){
    const amt=parseFloat($("#amt").value);if(!(amt>0))return;
    const type=$("#ttype").value;
    S.log.push({d:new Date().toISOString(),amt,type,note:$("#tnote").value.trim()});
    if(type==="main"){S.tripDone=true;const now=new Date().toISOString();for(const k in S.checked){if(S.checked[k]){const id=k.slice(k.indexOf(":")+1);if(ITEMS[id])S.last[id]=now;}}S.checked={};}
  }
  else if(a==="resetprices"){S.prices={};}
  else if(a==="resetall"){if(confirm("Erase the plan, prices and trip history on this device?")){S=JSON.parse(JSON.stringify(DEF));}}
  save();render();
});
document.addEventListener("change",e=>{
  const t=e.target,a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==="shopday"){S.shopDay=+t.value;}
  else if(a==="budget"){const v=parseFloat(t.value);if(v>0)S.budget=v;}
  else if(a==="taxrate"){const v=parseFloat(t.value);if(v>=0)S.taxRate=v;}
  else if(a==="movemeal"){const d=+t.dataset.d,i=+t.dataset.i,nd=+t.value;if(nd!==d){const sl=S.plan[d].splice(i,1)[0];sl.mode=defMode(nd);S.plan[nd].push(sl);}}
  else if(a==="fcap"){const v=parseInt(t.value,10);if(v>=0)S.freezeCap=v;}
  else return;
  save();render();
});
if(!S.menu||!Array.isArray(S.menu.ids)||!S.menu.ids.length){S.menu={seed:(Date.now()%90000)+1,ids:[]};S.menu.ids=genMenu(S.menu.seed,planned(),S.lastPicks||[]);save();}
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
</html>
